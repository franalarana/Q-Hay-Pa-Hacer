spring:
  application:
    name: backend

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/quehaypahacer}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:chapalele}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: https://login.microsoftonline.com/${AZURE_TENANT_ID:1abed6ed-c70a-4381-b9fe-0a67d2f0745e}/v2.0

  # Conexión al broker RabbitMQ
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:quehaypahacer}
    password: ${RABBITMQ_PASSWORD:quehaypahacer}
    listener:
      simple:
        # ACK explícito: cada consumidor confirma con channel.basicAck / basicNack
        acknowledge-mode: manual
        # Un mensaje rechazado NO se reencola: viaja al Dead Letter Exchange
        default-requeue-rejected: false
        prefetch: 10

app:
  azure:
    tenant-id: ${AZURE_TENANT_ID:1abed6ed-c70a-4381-b9fe-0a67d2f0745e}
    client-id: ${AZURE_CLIENT_ID:36bb5da3-29f4-4386-988b-244a844b285c}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  # Nombres centralizados de la mensajería (se inyectan con RabbitMQProperties).
  # Ninguna clase Java debe escribir estos nombres "a mano".
  rabbitmq:
    exchanges:
      principal: recetas.exchange
      dead-letter: recetas.dlx.exchange
    queues:
      tickets: recetas.tickets.queue
      notificaciones: recetas.notificaciones.queue
      tickets-dlq: recetas.tickets.dlq
      notificaciones-dlq: recetas.notificaciones.dlq
    routing-keys:
      tickets: recetas.ticket.generar
      notificaciones: recetas.despensa.notificar
      tickets-dlq: recetas.ticket.dlq
      notificaciones-dlq: recetas.despensa.dlq

server:
  port: ${SERVER_PORT:8080}
