spring:
  application:
    name: backend

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/quehaypahacer}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:pepe}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: https://login.microsoftonline.com/${AZURE_TENANT_ID:1abed6ed-c70a-4381-b9fe-0a67d2f0745e}/v2.0

app:
  azure:
    tenant-id: ${AZURE_TENANT_ID:1abed6ed-c70a-4381-b9fe-0a67d2f0745e}
    client-id: ${AZURE_CLIENT_ID:36bb5da3-29f4-4386-988b-244a844b285c}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

server:
  port: ${SERVER_PORT:8080}
