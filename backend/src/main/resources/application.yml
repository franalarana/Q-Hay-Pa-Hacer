spring:
  application:
    name: backend

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/quehaypahacer?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:pepe}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: https://login.microsoftonline.com/${AZURE_TENANT_ID:1abed6ed-c70a-4381-b9fe-0a67d2f0745e}/v2.0

  # Conexión al broker RabbitMQ (soporta cluster o nodo individual)
  rabbitmq:
    addresses: ${RABBITMQ_ADDRESSES:}
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:quehaypahacer}
    password: ${RABBITMQ_PASSWORD:quehaypahacer}
    listener:
      simple:
        # ACK explícito: cada consumidor confirma con channel.basicAck / basicNack
        acknowledge-mode: manual
        # Un mensaje rechazado NO se reencola: viaja al Dead Letter Exchange
        default-requeue-rejected: false
        prefetch: 10

  # Conexión y configuración de Apache Kafka (Streaming & Analítica)
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JacksonJsonSerializer
      properties:
        spring.json.add.type.headers: true
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JacksonJsonDeserializer
      auto-offset-reset: earliest
      properties:
        spring.json.trusted.packages: "cl.quehaypahacer.backend.messaging.kafka.event,cl.quehaypahacer.backend.messaging.event"

app:
  azure:
    tenant-id: ${AZURE_TENANT_ID:1abed6ed-c70a-4381-b9fe-0a67d2f0745e}
    client-id: ${AZURE_CLIENT_ID:36bb5da3-29f4-4386-988b-244a844b285c}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  # Nombres centralizados de la mensajería (se inyectan con RabbitMQProperties).
  # Ninguna clase Java debe escribir estos nombres "a mano".
  rabbitmq:
    exchanges:
      principal: recetas.exchange
      dead-letter: recetas.dlx.exchange
    queues:
      tickets: recetas.tickets.queue
      notificaciones: recetas.notificaciones.queue
      favoritos: recetas.favoritos.queue
      tickets-dlq: recetas.tickets.dlq
      notificaciones-dlq: recetas.notificaciones.dlq
      favoritos-dlq: recetas.favoritos.dlq
    routing-keys:
      tickets: recetas.ticket.generar
      notificaciones: recetas.despensa.notificar
      favoritos: recetas.favorito.marcar
      tickets-dlq: recetas.ticket.dlq
      notificaciones-dlq: recetas.despensa.dlq
      favoritos-dlq: recetas.favorito.dlq

  # Configuración centralizada de Kafka (Streaming y Analítica - Indicador Evaluación 5)
  kafka:
    topics:
      ingredientes-despensa: analitica.despensa.ingredientes
      ingredientes-cocina: analitica.cocina.ingredientes
    partitions: 2
    replication-factor: 1
    retention-ms: 604800000 # 7 días de retención de telemetría analítica
    cleanup-policy: delete
    consumer-groups:
      analitica: quehaypahacer-analitica-group
      auditoria: quehaypahacer-auditoria-group

server:
  port: ${SERVER_PORT:8080}
