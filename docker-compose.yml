services:
  # Broker de mensajería RabbitMQ en Clúster de 2 nodos (AMQP 5672/5673 + panel web 15672/15673)
  # Nodo 1 del Clúster
  rabbitmq1:
    image: rabbitmq:3.13-management
    container_name: quehaypahacer_rabbitmq1
    hostname: rabbit1
    restart: unless-stopped
    environment:
      RABBITMQ_ERLANG_COOKIE: ${RABBITMQ_ERLANG_COOKIE:-cookie_cluster_quehaypahacer}
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME:-quehaypahacer}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-quehaypahacer}
      RABBITMQ_NODENAME: rabbit@rabbit1
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - ./rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      quehaypahacer_net:
        aliases:
          - rabbitmq
          - rabbit1

  # Nodo 2 del Clúster (se integra automáticamente a rabbit1 mediante classic_config)
  rabbitmq2:
    image: rabbitmq:3.13-management
    container_name: quehaypahacer_rabbitmq2
    hostname: rabbit2
    restart: unless-stopped
    environment:
      RABBITMQ_ERLANG_COOKIE: ${RABBITMQ_ERLANG_COOKIE:-cookie_cluster_quehaypahacer}
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME:-quehaypahacer}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-quehaypahacer}
      RABBITMQ_NODENAME: rabbit@rabbit2
    ports:
      - "5673:5672"
      - "15673:15672"
    volumes:
      - ./rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
    depends_on:
      rabbitmq1:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      quehaypahacer_net:
        aliases:
          - rabbit2

  # Backend Spring Boot (API REST & BFF)
  # La base de datos es Amazon RDS — no se levanta contenedor MySQL local
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: quehaypahacer_backend
    restart: unless-stopped
    environment:
      # Endpoint de RDS: se pasa completo desde el .env
      DB_URL: ${DB_URL}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      AZURE_TENANT_ID: ${AZURE_TENANT_ID:-1abed6ed-c70a-4381-b9fe-0a67d2f0745e}
      AZURE_CLIENT_ID: ${AZURE_CLIENT_ID:-36bb5da3-29f4-4386-988b-244a844b285c}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-*}
      SERVER_PORT: 8080
      # Soporte para clúster: resuelve por nombres dentro de la red Docker
      RABBITMQ_HOST: rabbitmq1
      RABBITMQ_PORT: 5672
      RABBITMQ_ADDRESSES: rabbitmq1:5672,rabbitmq2:5672
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:-quehaypahacer}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-quehaypahacer}
    depends_on:
      rabbitmq1:
        condition: service_healthy
      rabbitmq2:
        condition: service_healthy
    ports:
      - "8080:8080"
    networks:
      - quehaypahacer_net

  # Frontend React SPA (Nginx)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8080/api}
        VITE_AZURE_CLIENT_ID: ${AZURE_CLIENT_ID:-36bb5da3-29f4-4386-988b-244a844b285c}
        VITE_AZURE_TENANT_ID: ${AZURE_TENANT_ID:-1abed6ed-c70a-4381-b9fe-0a67d2f0745e}
        VITE_REDIRECT_URI: ${VITE_REDIRECT_URI:-http://localhost}
    container_name: quehaypahacer_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ~/certs:/etc/nginx/certs:ro
      
    networks:
      - quehaypahacer_net

networks:
  quehaypahacer_net:
    driver: bridge

