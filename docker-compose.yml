services:
  # Broker de mensajería RabbitMQ en Clúster de 2 nodos (AMQP 5672/5673 + panel web 15672/15673)
  # Nodo 1 del Clúster
  rabbitmq1:
    image: rabbitmq:3.13-management
    container_name: quehaypahacer_rabbitmq1
    hostname: rabbit1
    restart: unless-stopped
    environment:
      RABBITMQ_ERLANG_COOKIE: ${RABBITMQ_ERLANG_COOKIE:-cookie_cluster_quehaypahacer}
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME:-quehaypahacer}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-quehaypahacer}
      RABBITMQ_NODENAME: rabbit@rabbit1
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - ./rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      quehaypahacer_net:
        aliases:
          - rabbitmq
          - rabbit1

  # Nodo 2 del Clúster (se integra automáticamente a rabbit1 mediante classic_config)
  rabbitmq2:
    image: rabbitmq:3.13-management
    container_name: quehaypahacer_rabbitmq2
    hostname: rabbit2
    restart: unless-stopped
    environment:
      RABBITMQ_ERLANG_COOKIE: ${RABBITMQ_ERLANG_COOKIE:-cookie_cluster_quehaypahacer}
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME:-quehaypahacer}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-quehaypahacer}
      RABBITMQ_NODENAME: rabbit@rabbit2
    ports:
      - "5673:5672"
      - "15673:15672"
    volumes:
      - ./rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
    depends_on:
      rabbitmq1:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      quehaypahacer_net:
        aliases:
          - rabbit2

  # Coordinador Zookeeper para Apache Kafka (Indicador Evaluación 5)
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: quehaypahacer_zookeeper
    restart: unless-stopped
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    networks:
      - quehaypahacer_net

  # Clúster Kafka de 3 brokers coordinados por Zookeeper (Indicador Evaluación 5)
  # Cada broker escucha en 2 listeners:
  #   PLAINTEXT      → kafkaN:29092  (tráfico dentro de la red Docker: backend, kafka-ui, réplicas)
  #   PLAINTEXT_HOST → localhost:909N (backend corriendo fuera de Docker, desde el PC)
  kafka1:
    image: confluentinc/cp-kafka:7.5.0
    container_name: quehaypahacer_kafka1
    hostname: kafka1
    restart: unless-stopped
    depends_on:
      - zookeeper
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka1:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_DEFAULT_REPLICATION_FACTOR: 3
      KAFKA_MIN_INSYNC_REPLICAS: 2
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_HEAP_OPTS: "-Xms256m -Xmx512m"
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:29092"]
      interval: 10s
      timeout: 10s
      retries: 12
    ports:
      - "9092:9092"
    networks:
      - quehaypahacer_net

  kafka2:
    image: confluentinc/cp-kafka:7.5.0
    container_name: quehaypahacer_kafka2
    hostname: kafka2
    restart: unless-stopped
    depends_on:
      - zookeeper
    environment:
      KAFKA_BROKER_ID: 2
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka2:29092,PLAINTEXT_HOST://localhost:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_DEFAULT_REPLICATION_FACTOR: 3
      KAFKA_MIN_INSYNC_REPLICAS: 2
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_HEAP_OPTS: "-Xms256m -Xmx512m"
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:29092"]
      interval: 10s
      timeout: 10s
      retries: 12
    ports:
      - "9093:9093"
    networks:
      - quehaypahacer_net

  kafka3:
    image: confluentinc/cp-kafka:7.5.0
    container_name: quehaypahacer_kafka3
    hostname: kafka3
    restart: unless-stopped
    depends_on:
      - zookeeper
    environment:
      KAFKA_BROKER_ID: 3
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka3:29092,PLAINTEXT_HOST://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_DEFAULT_REPLICATION_FACTOR: 3
      KAFKA_MIN_INSYNC_REPLICAS: 2
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_HEAP_OPTS: "-Xms256m -Xmx512m"
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:29092"]
      interval: 10s
      timeout: 10s
      retries: 12
    ports:
      - "9094:9094"
    networks:
      - quehaypahacer_net

  # Panel visual web Kafka-UI para administración de brokers, tópicos y mensajes (Indicador Evaluación 5)
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: quehaypahacer_kafka_ui
    restart: unless-stopped
    depends_on:
      - kafka1
      - kafka2
      - kafka3
    environment:
      KAFKA_CLUSTERS_0_NAME: quehaypahacer-cluster
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka1:29092,kafka2:29092,kafka3:29092
    ports:
      - "8085:8080"
    networks:
      - quehaypahacer_net

  # Backend Spring Boot (API REST & BFF)
  # La base de datos es Amazon RDS — no se levanta contenedor MySQL local
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: quehaypahacer_backend
    restart: unless-stopped
    environment:
      # Endpoint de RDS: se pasa completo desde el .env
      DB_URL: ${DB_URL}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      AZURE_TENANT_ID: ${AZURE_TENANT_ID:-1abed6ed-c70a-4381-b9fe-0a67d2f0745e}
      AZURE_CLIENT_ID: ${AZURE_CLIENT_ID:-36bb5da3-29f4-4386-988b-244a844b285c}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-*}
      SERVER_PORT: 8080
      # Soporte para clúster: resuelve por nombres dentro de la red Docker
      RABBITMQ_HOST: rabbitmq1
      RABBITMQ_PORT: 5672
      RABBITMQ_ADDRESSES: rabbitmq1:5672,rabbitmq2:5672
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:-quehaypahacer}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-quehaypahacer}
      # Conexión a los 3 brokers dentro de la red Docker (fijo: NO leer del .env,
      # porque el .env trae localhost:9092 para correr el backend fuera de Docker)
      KAFKA_BOOTSTRAP_SERVERS: kafka1:29092,kafka2:29092,kafka3:29092
    depends_on:
      rabbitmq1:
        condition: service_healthy
      rabbitmq2:
        condition: service_healthy
      kafka1:
        condition: service_healthy
      kafka2:
        condition: service_healthy
      kafka3:
        condition: service_healthy
    ports:
      - "8080:8080"
    networks:
      - quehaypahacer_net

  # Frontend React SPA (Nginx)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8080/api}
        VITE_AZURE_CLIENT_ID: ${AZURE_CLIENT_ID:-36bb5da3-29f4-4386-988b-244a844b285c}
        VITE_AZURE_TENANT_ID: ${AZURE_TENANT_ID:-1abed6ed-c70a-4381-b9fe-0a67d2f0745e}
        VITE_REDIRECT_URI: ${VITE_REDIRECT_URI:-http://localhost}
    container_name: quehaypahacer_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ~/certs:/etc/nginx/certs:ro
      
    networks:
      - quehaypahacer_net

volumes:
  mysql_data:
    driver: local

networks:
  quehaypahacer_net:
    driver: bridge

