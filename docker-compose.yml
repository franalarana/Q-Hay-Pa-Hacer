services:
  # Broker de mensajería RabbitMQ (AMQP 5672 + panel web 15672)
  # El usuario "guest" solo funciona desde localhost dentro del contenedor,
  # por eso se define un usuario propio que usa el backend.
  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: quehaypahacer_rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME:-quehaypahacer}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-quehaypahacer}
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - quehaypahacer_net

  # Backend Spring Boot (API REST & BFF)
  # La base de datos es Amazon RDS — no se levanta contenedor MySQL local
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: quehaypahacer_backend
    restart: unless-stopped
    environment:
      # Endpoint de RDS: se pasa completo desde el .env
      DB_URL: ${DB_URL}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      AZURE_TENANT_ID: ${AZURE_TENANT_ID:-1abed6ed-c70a-4381-b9fe-0a67d2f0745e}
      AZURE_CLIENT_ID: ${AZURE_CLIENT_ID:-36bb5da3-29f4-4386-988b-244a844b285c}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-*}
      SERVER_PORT: 8080
      # Dentro de la red Docker el broker se resuelve por nombre de servicio
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:-quehaypahacer}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-quehaypahacer}
    depends_on:
      rabbitmq:
        condition: service_healthy
    ports:
      - "8080:8080"
    networks:
      - quehaypahacer_net

  # Frontend React SPA (Nginx)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8080/api}
        VITE_AZURE_CLIENT_ID: ${AZURE_CLIENT_ID:-36bb5da3-29f4-4386-988b-244a844b285c}
        VITE_AZURE_TENANT_ID: ${AZURE_TENANT_ID:-1abed6ed-c70a-4381-b9fe-0a67d2f0745e}
        VITE_REDIRECT_URI: ${VITE_REDIRECT_URI:-http://localhost}
    container_name: quehaypahacer_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ~/certs:/etc/nginx/certs:ro
      
    networks:
      - quehaypahacer_net

networks:
  quehaypahacer_net:
    driver: bridge

