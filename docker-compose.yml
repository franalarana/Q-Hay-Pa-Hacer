services:
  # Base de Datos MySQL 8.0
  db:
    image: mysql:8.0
    container_name: quehaypahacer_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME:-quehaypahacer}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-pepe}
      MYSQL_USER: ${DB_USER:-quehaypahacer_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-pepe}
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD:-pepe}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - quehaypahacer_net

  # Backend Spring Boot (API REST & BFF)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: quehaypahacer_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:mysql://db:3306/${DB_NAME:-quehaypahacer}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
      DB_USERNAME: root
      DB_PASSWORD: ${DB_ROOT_PASSWORD:-pepe}
      AZURE_TENANT_ID: ${AZURE_TENANT_ID:-1abed6ed-c70a-4381-b9fe-0a67d2f0745e}
      AZURE_CLIENT_ID: ${AZURE_CLIENT_ID:-36bb5da3-29f4-4386-988b-244a844b285c}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:80,http://localhost}
      SERVER_PORT: 8080
    ports:
      - "8080:8080"
    networks:
      - quehaypahacer_net

  # Frontend React SPA
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8080/api}
        VITE_AZURE_CLIENT_ID: ${AZURE_CLIENT_ID:-36bb5da3-29f4-4386-988b-244a844b285c}
        VITE_AZURE_TENANT_ID: ${AZURE_TENANT_ID:-1abed6ed-c70a-4381-b9fe-0a67d2f0745e}
        VITE_REDIRECT_URI: ${VITE_REDIRECT_URI:-http://localhost}
    container_name: quehaypahacer_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"
    networks:
      - quehaypahacer_net

volumes:
  mysql_data:
    driver: local

networks:
  quehaypahacer_net:
    driver: bridge
